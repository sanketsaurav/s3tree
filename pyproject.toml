[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3tree"
version = "0.4.0"
description = "Typed tree navigation for S3 and S3-compatible object storage."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Sanket Saurav", email = "sanketsaurav@gmail.com" },
]
keywords = ["s3", "boto3", "object-storage", "cloudflare-r2", "minio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]>=1.34",
  "build>=1.2",
  "moto[s3]>=5.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "ty>=0.0.56",
  "types-python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/sanketsaurav/s3tree"
Repository = "https://github.com/sanketsaurav/s3tree"
Issues = "https://github.com/sanketsaurav/s3tree/issues"
Changelog = "https://github.com/sanketsaurav/s3tree/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["s3tree"]
include-package-data = true

[tool.setuptools.package-data]
s3tree = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--cov=s3tree --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = ["s3tree"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["s3tree", "tests"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = ["ANN401"]
preview = true
select = [
  "ANN",
  "B",
  "E",
  "F",
  "I",
  "PYI",
  "UP",
  "W",
]
